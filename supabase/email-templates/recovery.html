<!--
  Supabase Dashboard → Authentication → Email Templates → Reset Password

  MANUAL CHANGE REQUIRED (not applied by deploy).
  Use SiteURL (already allowlisted as https://app.pridmora.com), not RedirectTo.
  RedirectTo for resetPasswordForEmail still points at /auth/callback for PKCE;
  that path needs the browser code-verifier cookie and fails across browsers.
  TokenHash + /auth/confirm works in any browser without PKCE cookies.
-->
<h2>Reset your password</h2>
<p>Follow this link to set a new password for your Pridmora account:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset-password">
    Reset password
  </a>
</p>
<p>If you did not request a password reset, you can ignore this email.</p>
